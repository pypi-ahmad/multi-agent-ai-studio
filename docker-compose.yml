services:
  api:
    build:
      context: .
      dockerfile: infra/compose/api.Dockerfile
    env_file:
      - .env
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/compose/worker.Dockerfile
    env_file:
      - .env
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0
    command: serve
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ${OLLAMA_MODELS_PATH:-/home/ahmad/.ollama/models}:/root/.ollama/models
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ollama-bootstrap:
    image: ollama/ollama:latest
    profiles: ["ollama-bootstrap"]
    env_file:
      - .env
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export OLLAMA_HOST=http://ollama:11434
        for model in $$(echo "$${OLLAMA_BOOTSTRAP_MODELS}" | tr ',' ' '); do
          name="$$(echo "$$model" | xargs)"
          if [ -n "$$name" ]; then
            echo "Pulling $$name"
            ollama pull "$$name"
          fi
        done

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_HOST_PORT:-8000}/api/v1}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_studio
      POSTGRES_USER: ai_studio
      POSTGRES_PASSWORD: ai_studio
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_studio -d ai_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/compose/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_HOST_PORT:-4317}:4317"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: ["observability"]
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  langfuse-web:
    image: langfuse/langfuse:3
    profiles: ["observability"]
    environment:
      DATABASE_URL: postgresql://ai_studio:ai_studio@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_DB: default
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      NEXTAUTH_SECRET: local-secret
      NEXTAUTH_URL: http://localhost:3001
      SALT: local-salt
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    ports:
      - "${LANGFUSE_HOST_PORT:-3001}:3000"
    depends_on:
      clickhouse:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  clickhouse_data:
