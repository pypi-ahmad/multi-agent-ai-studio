[project]
name = "multi-agent-ai-studio"
version = "0.1.0"
description = "Production-grade local multi-agent AI studio powered by Ollama"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "email-validator>=2.3.0",
  "pydantic-settings>=2.10.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "alembic>=1.16.4",
  "asyncpg>=0.30.0",
  "redis>=5.2.1,<6.0.0",
  "arq>=0.26.3",
  "qdrant-client>=1.15.1,<1.16.0",
  "minio>=7.2.16",
  "httpx>=0.28.1",
  "orjson>=3.11.3",
  "loguru>=0.7.3",
  "pyjwt[crypto]>=2.10.1",
  "passlib[bcrypt]>=1.7.4",
  "authlib>=1.6.1",
  "python-multipart>=0.0.20",
  "langgraph>=0.6.7",
  "langchain-core>=0.3.76",
  "langfuse>=3.5.1",
  "opentelemetry-api>=1.37.0",
  "opentelemetry-sdk>=1.37.0",
  "opentelemetry-exporter-otlp>=1.37.0",
  "opentelemetry-instrumentation-fastapi>=0.58b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.58b0",
  "polars>=1.33.1",
  "duckdb>=1.3.2",
  "pandas>=2.3.2",
  "openpyxl>=3.1.5",
  "python-docx>=1.2.0",
  "pypdf>=6.0.0",
  "beautifulsoup4>=4.13.5",
  "lxml>=6.0.2",
  "trafilatura>=2.0.0",
  "playwright>=1.55.0",
  "python-slugify>=8.0.4",
  "tenacity>=9.1.2",
  "psutil>=7.1.0",
  "numpy>=2.3.3",
  "mkdocs-material>=9.7.6",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.13.0",
  "mypy>=1.18.2",
  "types-passlib>=1.7.7.20250602",
  "types-python-dateutil>=2.9.0.20250822",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false
strict_optional = true
ignore_missing_imports = true
disable_error_code = ["attr-defined", "misc", "assignment", "union-attr"]
mypy_path = ["apps/api/src"]

[tool.uv]
package = false
